[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "countback"
version = "0.1.0"
description = "Countback DSO for a seasonal wholesaler, with a Shapley mix-versus-behaviour bridge and a validated Tableau workbook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "countback contributors" }]
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.6"]

[project.scripts]
countback = "countback.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/countback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
